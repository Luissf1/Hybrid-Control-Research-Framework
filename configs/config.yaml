# ============================================================================
# Centralized configuration for the hybrid adaptive control pipeline.
# ============================================================================

# ----------------------------------------------------------------------------
# Simulation environment (simplified quadrotor)
# ----------------------------------------------------------------------------
environment:
  max_steps: 200            # Maximum steps per episode (timeout)
  target_altitude: 5.0      # Altitude set-point in meters
  tilt_limit: 30.0          # Tilt threshold (deg) that terminates the episode
  dt: 0.05                  # Euler integration step in seconds

# ----------------------------------------------------------------------------
# Tabular Q-Learning agent
# ----------------------------------------------------------------------------
rl:
  alpha: 0.1                # Learning rate
  gamma: 0.99               # Discount factor
  epsilon: 1.0              # Initial exploration probability (100%)
  epsilon_decay: 0.995      # Multiplicative decay applied per episode
  epsilon_min: 0.01         # Exploration floor
  episodes: 1000            # Increased from 500 so the agent can exploit
  seed: 42                  # Global seed for reproducibility

# ----------------------------------------------------------------------------
# PSO used to tune fuzzy membership centers
# ----------------------------------------------------------------------------
pso:
  num_particles: 30         # Swarm size
  max_iter: 30              # Reduced from 50 to save time (still converges)
  lb_error: -4.0
  ub_error: 4.0
  lb_delta: -1.6
  ub_delta: 1.6
  seed: 42

# ----------------------------------------------------------------------------
# Output paths (auto-created on first run)
# ----------------------------------------------------------------------------
paths:
  results_dir: "results"
  fuzzy_params_file: "results/best_fuzzy_params.pkl"
  rl_curve_file: "results/rl_learning_curve.png"
  hybrid_comparison_file: "results/hybrid_comparison.png"